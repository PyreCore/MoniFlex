# Teste puis publie la version web sur GitHub Pages à chaque push sur main.
name: Déploiement web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build web (version et commit visibles dans Paramètres)
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          # --no-web-resources-cdn : moteur Flutter (CanvasKit) servi par le
          # site lui-même, pour que l'app s'ouvre aussi hors connexion.
          flutter build web --release --base-href /MoniFlex/ \
            --no-web-resources-cdn \
            --dart-define=APP_VERSION=$VERSION \
            --dart-define=APP_COMMIT=${GITHUB_SHA::7}
          cp tool/flutter_service_worker.js build/web/flutter_service_worker.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
